<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>GTA VI nedtælling</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Gennemsigtig baggrund, så den kan lægges direkte oven på streamen i OBS */
  :root {
    --pink: #ff3d8b;
    --orange: #ff9a3c;
    --yellow: #ffd23f;
    --teal: #29e6d4;
    --night: rgba(26, 8, 48, 0.78);
    --text: #fff4fb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .widget {
    width: 760px;
    padding: 22px 30px 20px;
    background: var(--night);
    border-radius: 18px;
    border: 3px solid var(--pink);
    box-shadow: 0 0 0 3px rgba(255,61,139,.25), 0 0 40px rgba(255,61,139,.45);
    text-align: center;
    transform-origin: center;
  }
  .title {
    font-family: "Bowlby One", Impact, sans-serif;
    font-size: 44px;
    letter-spacing: 1px;
    background: linear-gradient(180deg, var(--yellow) 0%, var(--orange) 45%, var(--pink) 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px rgba(255,61,139,.55));
  }
  .sub {
    font-size: 24px; font-weight: 500; color: var(--teal);
    margin: 2px 0 14px;
  }
  .clock { display: flex; justify-content: center; align-items: flex-start; gap: 10px; }
  .unit { min-width: 150px; }
  .num {
    font-family: "Bowlby One", Impact, sans-serif;
    font-size: 96px; line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    text-shadow: 0 0 18px rgba(41,230,212,.55);
  }
  .label { font-size: 24px; font-weight: 700; color: var(--orange); margin-top: 2px; }
  .sep {
    font-family: "Bowlby One", Impact, sans-serif;
    font-size: 80px; line-height: 1.1; color: var(--pink);
  }
  .done .title { font-size: 64px; animation: pulse 1.2s ease-in-out infinite; }
  .done .clock, .done .sub { display: none; }
  .done .msg { display: block; }
  .msg { display: none; font-size: 34px; font-weight: 700; color: var(--teal); margin-top: 6px; }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  @media (prefers-reduced-motion: reduce) { .done .title { animation: none; } }
</style>
</head>
<body>
  <div class="widget" id="widget">
    <div class="title" id="title">GTA VI</div>
    <div class="sub" id="sub">UDKOMMER OM</div>
    <div class="clock" id="clock">
      <div class="unit"><div class="num" id="d">00</div><div class="label">dage</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="num" id="h">00</div><div class="label">timer</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="num" id="m">00</div><div class="label">minutter</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="num" id="s">00</div><div class="label">sekunder</div></div>
    </div>
    <div class="msg" id="msg">Velkommen til Vice City!</div>
  </div>

<script>
  /*
    Indstillinger kan rettes her eller sættes i URL'en i OBS, fx:
    gta6-countdown.html?date=2026-11-19T00:00:00&title=GTA%20VI&scale=1.2
    Tiden læses i din computers lokale tidszone (dansk tid, hvis din pc er sat til det).
  */
  var params = new URLSearchParams(location.search);
  var TARGET = new Date(params.get("date") || "2026-11-19T00:00:00");
  var TITLE  = params.get("title") || "GTA VI";
  var SCALE  = parseFloat(params.get("scale")) || 1;
  var OPACITY = params.has("opacity") ? parseFloat(params.get("opacity")) : 0.8; // 0.8 = 80 % synlig

  document.getElementById("title").textContent = TITLE;
  document.getElementById("widget").style.transform = "scale(" + SCALE + ")";
  document.getElementById("widget").style.opacity = OPACITY;

  function pad(n) { return String(n).padStart(2, "0"); }

  function tick() {
    var diff = TARGET.getTime() - Date.now();
    if (isNaN(diff)) { document.getElementById("sub").textContent = "Ugyldig dato"; return; }
    if (diff <= 0) { document.getElementById("widget").classList.add("done"); return; }
    var s = Math.floor(diff / 1000);
    document.getElementById("d").textContent = pad(Math.floor(s / 86400));
    document.getElementById("h").textContent = pad(Math.floor(s % 86400 / 3600));
    document.getElementById("m").textContent = pad(Math.floor(s % 3600 / 60));
    document.getElementById("s").textContent = pad(s % 60);
  }
  tick();
  setInterval(tick, 250);
</script>
</body>
</html>
