  .no-bg .bg { display: none; }
  .stars { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: .55;
           background-image:
             radial-gradient(1.5px 1.5px at 8% 18%, #fff, transparent), radial-gradient(1px 1px at 22% 80%, #fff, transparent),
             radial-gradient(1.5px 1.5px at 35% 12%, #ffd9ec, transparent), radial-gradient(1px 1px at 48% 90%, #fff, transparent),
             radial-gradient(1.5px 1.5px at 61% 22%, #fff, transparent), radial-gradient(1px 1px at 73% 70%, #ffe3c2, transparent),
             radial-gradient(1.5px 1.5px at 84% 14%, #fff, transparent), radial-gradient(1px 1px at 93% 55%, #fff, transparent),
             radial-gradient(1px 1px at 15% 50%, #ffd9ec, transparent), radial-gradient(1.5px 1.5px at 55% 55%, #fff, transparent);
           animation: twinkle 5s ease-in-out infinite alternate; }

  /* Solen med striber (Vice City) og VI */
  .logo { position: relative; z-index: 3; width: 170px; height: 170px; flex: none;
          display: flex; align-items: center; justify-content: center; }
  .sun { position: absolute; inset: 0; border-radius: 50%;
         background: linear-gradient(180deg, #ffb347 0%, #ff6a3c 30%, var(--pink) 65%, var(--purple) 100%);
         -webkit-mask-image: linear-gradient(180deg, #000 0 56%, transparent 56% 61%, #000 61% 69%, transparent 69% 76%, #000 76% 85%, transparent 85% 92%, #000 92%);
         mask-image: linear-gradient(180deg, #000 0 56%, transparent 56% 61%, #000 61% 69%, transparent 69% 76%, #000 76% 85%, transparent 85% 92%, #000 92%);
         animation: breathe 6s ease-in-out infinite; }
  .vi { position: relative; font-family: "Archivo Black", Impact, sans-serif; font-size: 104px; line-height: 1;
        letter-spacing: -2px; color: #fff; text-shadow: 0 4px 0 rgba(90,0,80,.45); }
  .logo img { display: none; position: relative; width: 100%; height: 100%; object-fit: contain;
              filter: drop-shadow(0 0 12px rgba(255,61,139,.3)); animation: glowlogo 6s ease-in-out infinite; }
  .logo.custom { width: 230px; height: 175px; }
  .has-logo .title { display: none; }
  .logo.custom .sun, .logo.custom .vi { display: none; }
  .logo.custom img { display: block; }

  .palms { position: absolute; right: 8px; bottom: 6px; width: 120px; height: 150px; z-index: 1; opacity: .55;
            transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite alternate; }
  .main { position: relative; z-index: 3; flex: 1; min-width: 0; }
  .title { font-family: "Archivo Black", Impact, sans-serif; font-size: 24px; letter-spacing: 3px; text-transform: uppercase; }
  .subrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 10px; padding: 0 8px; }
  #sub { font-size: 28px; font-weight: 600; color: var(--orange); letter-spacing: .5px; }
  #subdate { font-size: 21px; font-weight: 500; color: var(--muted); }
  .clock { display: flex; align-items: stretch; }
  .unit { flex: 1; text-align: center; padding: 0 8px; }
  .unit + .unit { border-left: 1px solid rgba(255,255,255,.18); }
  .unit.first { border-left: none; }
  .num { font-family: "Archivo Black", Impact, sans-serif; font-size: 62px; line-height: 1; font-variant-numeric: tabular-nums; }
  .num.flip { animation: flip .3s ease-out; }
  #d { background: linear-gradient(180deg, #ffd23f 0%, #ff8a3c 50%, #ff3d8b 100%);
       -webkit-background-clip: text; background-clip: text; color: transparent; }
  .label { font-size: 22px; font-weight: 600; color: var(--orange); margin-top: 4px; }
  .msg { display: none; font-family: "Archivo Black", Impact, sans-serif; font-size: 46px; line-height: 1.05; margin-top: 2px; text-wrap: balance; }

  /* Slutskærm */
  .flood { position: absolute; inset: 0; z-index: 0; opacity: 0; transition: opacity 1.6s ease;
           background: linear-gradient(120deg, #3b0a5c 0%, #b5179e 32%, #ff3d8b 64%, #ff8a3c 100%); }
  .sheen { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; z-index: 2; opacity: 0;
           background: linear-gradient(100deg, transparent, rgba(255,255,255,.3), transparent);
           transform: translateX(-120%) skewX(-12deg); }
  .done .flood { opacity: .6; }
  .done .clock { display: none; }
  .done .msg { display: block; animation: pop .8s cubic-bezier(.2,1.4,.4,1) both; }
  .done #sub, .done #subdate { color: #fff; }
  .done .sun { filter: drop-shadow(0 0 26px rgba(255,255,255,.45)); }
  .done .logo img { animation: none; filter: drop-shadow(0 0 26px rgba(255,255,255,.55)); }
  .done .sheen { opacity: 1; animation: sheen 5s ease-in-out 1.6s infinite; }

  /* De sidste 10 sekunder: kun sekunderne, store og pulserende */
  .final { box-shadow: inset 0 0 0 2px var(--pink), inset 0 0 36px rgba(255,61,139,.4); }
  .final .unit:not(:last-child) { display: none; }
  .final .clock { justify-content: center; }
  .final .unit + .unit { border-left: none; }
  .final .num#s { font-size: 100px; animation: beat 1s ease-in-out infinite; }
  .final .label#ls { font-size: 26px; }

  /* Øjeblikket hvor tiden rammer nul */
  .celebrate .logo img { animation: slam .9s cubic-bezier(.2, 1.3, .3, 1) both; }
  #dbg { display: none; position: fixed; left: 6px; bottom: 4px; z-index: 20; font: 12px monospace; color: #fff; background: rgba(0,0,0,.7); padding: 2px 6px; border-radius: 4px; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  .flash { position: fixed; inset: 0; pointer-events: none; z-index: 11; opacity: 0;
           background: radial-gradient(circle at center, rgba(255,255,255,.9) 0%, rgba(255,138,60,.4) 40%, transparent 70%); }
  .flash.go { animation: flash 1.1s ease-out; }
  @keyframes beat { 0% { transform: scale(1.18); } 60%, 100% { transform: scale(1); } }
  @keyframes slam { 0% { transform: scale(1.7); opacity: 0; filter: blur(8px); } 60% { opacity: 1; filter: blur(0); } 100% { transform: scale(1); } }
  @keyframes flash { 0% { opacity: 0; } 12% { opacity: .9; } 100% { opacity: 0; } }

  .widget:not(.done) .sheen { opacity: .45; animation: sweep 14s ease-in-out 4s infinite; }
  @keyframes enter { from { top: 30px; } to { top: 0; } }
  @keyframes sway { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }
  @keyframes twinkle { from { opacity: .3; } to { opacity: .65; } }
  @keyframes sweep { 0% { transform: translateX(-120%) skewX(-12deg); } 12%, 100% { transform: translateX(380%) skewX(-12deg); } }
  @keyframes glowlogo { 50% { filter: drop-shadow(0 0 26px rgba(255,138,60,.55)); } }
  @keyframes breathe { 50% { filter: drop-shadow(0 0 26px rgba(255,61,139,.55)); } }
  @keyframes flip { from { transform: translateY(-10px); opacity: .35; } to { transform: none; opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
  @keyframes sheen { 0% { transform: translateX(-120%) skewX(-12deg); } 35%, 100% { transform: translateX(380%) skewX(-12deg); } }
  @media (prefers-reduced-motion: reduce) {
    .sun, .logo img, .num.flip, .done .msg, .done .sheen, .final .num#s, .celebrate .logo img { animation: none; }
    .flash, #fx { display: none; }
    .widget, .palms, .stars, .widget:not(.done) .sheen { animation: none; }
    .widget:not(.done) .sheen { opacity: 0; } .bar { transition: none; }
    .done .sheen { opacity: 0; } .flood { transition: none; }
  }
</style>
</head>
<body>
  <canvas id="fx"></canvas>
  <div class="flash" id="flash"></div>
  <div id="dbg"></div>
  <div class="widget has-logo" id="widget">
    <div class="bg"></div>
    <div class="flood"></div>
    <div class="stars"></div>
    <div class="bar" id="bar"></div>

      <div class="subrow"><span id="sub">Udgives om:</span><span id="subdate"></span></div>
      <div class="clock" id="clock">
        <div class="unit"><div class="num" id="d">00</div><div class="label" id="ld">dage</div></div>
        <div class="unit"><div class="num" id="h">00</div><div class="label" id="lh">timer</div></div>
        <div class="unit"><div class="num" id="m">00</div><div class="label" id="lm">minutter</div></div>
        <div class="unit"><div class="num" id="s">00</div><div class="label" id="ls">sekunder</div></div>
      </div>
      <div class="msg" id="msg">Velkommen til Vice City</div>
    </div>
  </div>

<script>
  /*
    Indstillinger hentes fra config.json hvert 30. sekund. URL-parametre (fx ?opacity=0.6) vinder over config.json.
    "showLogo": false viser solen med VI i stedet for logoet. "logo": valgfrit andet billede (fx "logo2.png").
    "version": ændres tallet, genindlæser widgetten sig selv.
  */
  var cfg = {
    date: "2026-11-19T00:00:00+01:00", title: "Grand Theft Auto VI", subtitle: "Udgives om:",
    doneSubtitle: "Udkommet", doneText: "Velkommen til Vice City", opacity: 0.8, scale: 1, logo: "", showLogo: true, showBackground: true, position: "center", phases: true, progressDays: 7
  };
  var params = new URLSearchParams(location.search);
  var el = function (id) { return document.getElementById(id); };
  var target = new Date(cfg.date), loadedVersion = null, isDone = false;
  // ?demo=1 starter en prøve-nedtælling på 13 sekunder, så du kan se hele finalen
  var DEMO = params.has("demo") ? new Date(Date.now() + 13000).toISOString() : null;
  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Konfetti ---------- */
  var fx = el("fx"), ctx = fx.getContext("2d"), parts = [], raf = null;
  var COLORS = ["#ffd23f", "#ff8a3c", "#ff3d8b", "#b5179e", "#ffffff", "#29e6d4"];
  function sizeFx() { fx.width = innerWidth; fx.height = innerHeight; }
  addEventListener("resize", sizeFx); sizeFx();
  function burst(n, x, y, spread) {
    for (var i = 0; i < n; i++) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * spread, sp = 7 + Math.random() * 9;
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 0.28 + Math.random() * 0.1,
        w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
        c: COLORS[Math.floor(Math.random() * COLORS.length)], life: 1 });
    }
    if (!raf) raf = requestAnimationFrame(loop);
  }
  function loop() {
    ctx.clearRect(0, 0, fx.width, fx.height);
    parts = parts.filter(function (p) { return p.life > 0 && p.y < fx.height + 30; });
    parts.forEach(function (p) {
      p.vx *= 0.99; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 0.004;
      ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
      ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
    if (parts.length) raf = requestAnimationFrame(loop); else { raf = null; ctx.clearRect(0, 0, fx.width, fx.height); }
  }
  function celebrate() {
    el("widget").classList.add("celebrate");
    if (reduced) return;
    var f = el("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
    var r = el("widget").getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    burst(120, cx, cy, 2.6);
    setTimeout(function () { burst(70, r.left + 50, r.bottom, 1.3); }, 250);
    setTimeout(function () { burst(70, r.right - 50, r.bottom, 1.3); }, 450);
    setTimeout(function () { burst(90, cx, cy, 2.8); }, 900);
  }

  /* ---------- Placering i browser-kilden ---------- */
  function place() {
    var p = String(cfg.position || "center"), b = document.body.style;
    b.alignItems = /top/.test(p) ? "flex-start" : /bottom/.test(p) ? "flex-end" : "center";
    b.justifyContent = /left/.test(p) ? "flex-start" : /right/.test(p) ? "flex-end" : "center";
    el("widget").style.transformOrigin = (/left/.test(p) ? "left" : /right/.test(p) ? "right" : "center") + " " +
      (/top/.test(p) ? "top" : /bottom/.test(p) ? "bottom" : "center");
  }

  // Overskriften skifter, jo tættere vi kommer (slå fra med "phases": false)
  function subtitleNow() {
    var d = target.getTime() - Date.now();
    if (String(cfg.phases) === "false" || isNaN(d)) return cfg.subtitle;
    if (d <= 600000) return "Snart!";
    if (d <= 3600000) return "Under en time:";
    if (d <= 86400000) return "Under 24 timer:";
    return cfg.subtitle;
  }

  function refreshSub() {
    el("sub").textContent = isDone ? cfg.doneSubtitle : subtitleNow();
    el("subdate").textContent = isNaN(target) ? "" :
      target.toLocaleDateString("da-DK", { day: "numeric", month: "long", year: "numeric" });
  }

  function apply() {
    ["date", "title", "subtitle", "doneSubtitle", "doneText", "opacity", "scale", "logo", "showLogo", "showBackground", "position", "phases", "progressDays"].forEach(function (k) {
      if (params.has(k)) cfg[k] = params.get(k);
    });
    if (DEMO) cfg.date = DEMO;
    target = new Date(cfg.date);
    place();
    el("title").textContent = cfg.title;
    el("msg").textContent = cfg.doneText;
    refreshSub();
    var o = parseFloat(cfg.opacity), sc = parseFloat(cfg.scale);
    el("widget").style.opacity = isNaN(o) ? 0.8 : o;
    el("widget").style.transform = "scale(" + (isNaN(sc) ? 1 : sc) + ")";
    var img = el("logoimg");
    var show = String(cfg.showLogo) !== "false";
    el("widget").classList.toggle("no-bg", String(cfg.showBackground) === "false");
    el("logo").classList.toggle("custom", show);
    el("widget").classList.toggle("has-logo", show);
    if (cfg.logo && img.getAttribute("src") !== cfg.logo) img.src = cfg.logo; // valgfrit eget logo
  }

  // ?debug=1 viser en lille statuslinje nederst, så du kan se om config.json bliver læst
  function dbg(t) { if (!params.has("debug")) return; var d = el("dbg"); d.style.display = "block"; d.textContent = t; }

  function load() {
    fetch("config.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (j) {
        if (j.version !== undefined) {
          if (loadedVersion === null) loadedVersion = j.version;
          else if (j.version !== loadedVersion) { location.reload(); return; }
        }
        for (var k in j) cfg[k] = j[k];
        apply();
        dbg("config OK · version " + j.version + " · " + new Date().toLocaleTimeString("da-DK"));
      })
      .catch(function (e) { apply(); dbg("config FEJL: " + e.message + " · " + location.protocol); });
  }

  function pad(n) { return String(n).padStart(2, "0"); }
  function setNum(id, v) {
    var n = el(id);
    if (n.textContent === v) return;
    n.textContent = v;
    n.classList.remove("flip"); void n.offsetWidth; n.classList.add("flip");
  }

  function lab(id, v, one, many) { el(id).textContent = parseInt(v, 10) === 1 ? one : many; }

  function tick() {
    var diff = target.getTime() - Date.now();
    if (isNaN(diff)) { el("sub").textContent = "Ugyldig dato"; return; }
    var done = diff <= 0;
    if (done !== isDone) {
      isDone = done;
      el("widget").classList.toggle("done", done);
      if (!done) el("widget").classList.remove("celebrate");
      refreshSub();
      // Kun fest, hvis nedtællingen lige er slut (ikke ved genindlæsning længe efter)
      if (done && Date.now() - target.getTime() < 60000) celebrate();
    }
    if (done) { el("widget").classList.remove("final"); el("bar").style.transform = "scaleX(1)"; return; }
    el("widget").classList.toggle("final", diff <= 10000);
    var t = subtitleNow(); if (el("sub").textContent !== t) el("sub").textContent = t;
    var pd = parseFloat(cfg.progressDays);
    var prog = pd > 0 ? Math.max(0, Math.min(1, 1 - diff / (pd * 86400000))) : 1;
    el("bar").style.transform = "scaleX(" + prog + ")";
    var s = Math.floor(diff / 1000);
    setNum("d", pad(Math.floor(s / 86400)));
    setNum("h", pad(Math.floor(s % 86400 / 3600)));
    setNum("m", pad(Math.floor(s % 3600 / 60)));
    setNum("s", pad(s % 60));
    // Skjul enheder i toppen, der er nået til nul (dage, så timer, så minutter)
    var dd = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), mm = Math.floor(s % 3600 / 60);
    var vis = { d: dd > 0, h: dd > 0 || hh > 0, m: dd > 0 || hh > 0 || mm > 0, s: true }, first = true;
    ["d", "h", "m", "s"].forEach(function (k) {
      var u = el(k).parentNode;
      u.style.display = vis[k] ? "" : "none";
      u.classList.toggle("first", vis[k] && first);
      if (vis[k]) first = false;
    });
    lab("ld", el("d").textContent, "dag", "dage");
    lab("lh", el("h").textContent, "time", "timer");
    lab("lm", el("m").textContent, "minut", "minutter");
    lab("ls", el("s").textContent, "sekund", "sekunder");
  }

  apply(); load(); tick();
  setInterval(tick, 250);
  setInterval(load, 30000);
</script>
</body>
</html>
